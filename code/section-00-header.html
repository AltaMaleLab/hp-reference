.alta-hd *,
.alta-hd *::before,
.alta-hd *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.alta-hd {
  background: #000000;
  border-bottom: 1px solid #1F1F1F;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.alta-hd__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 32px;
  height: 88px;
  padding: 0 48px;
}

/* --- Logo ----------------------------------------------------- */
.alta-hd__logo {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: #C8B568;
  white-space: nowrap;
}

.alta-hd__glyph {
  font-family: 'Poppins', sans-serif;
  font-size: 24px;
  line-height: 1;
  color: #C8B568;
}

.alta-hd__name {
  font-family: 'Gaoel', 'Poppins', sans-serif;
  font-weight: 400;
  font-size: 20px;
  letter-spacing: 0.14em;
  line-height: 1;
  color: #C8B568;
}

.alta-hd__star {
  font-family: 'Poppins', sans-serif;
  font-size: 0.6em;
  vertical-align: 0.2em;
  margin: 0 0.5em;
}

/* --- Menu + langues ------------------------------------------- */
.alta-hd__right {
  display: flex;
  align-items: center;
  gap: 48px;
}

.alta-hd__nav {
  display: flex;
  gap: 36px;
}

.alta-hd__link,
.alta-hd__lang a,
.alta-hd__toggle {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  text-decoration: none;
  line-height: 1;
}

.alta-hd__link {
  color: #B8B8B8;
}

.alta-hd__lang {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  color: #5A5A5A;
}

.alta-hd__lang a {
  color: #8A8A8A;
}

.alta-hd__lang a.is-active {
  color: #EDEDED;
}

/* --- Mobile --------------------------------------------------- */
.alta-hd__mobile {
  display: none;
}

@media (max-width: 960px) {
  .alta-hd__inner {
    height: 72px;
    padding: 0 20px;
  }
  .alta-hd__name {
    font-size: 16px;
  }
  .alta-hd__glyph {
    font-size: 19px;
  }
  .alta-hd__logo {
    gap: 10px;
