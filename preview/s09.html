<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Preview S09</title>
<style>@font-face{font-family:'Gaoel';src:url('../assets/gaoel.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}html,body{margin:0;padding:0;background:#000000;}</style>
</head><body>
<!-- Simulates the Divi section: black background, padding 0, one Code Module containing the file below, unchanged. -->
<div class="divi-section">
<!-- ============================================================
     ALTA MALE LAB — Section 9: From Knowledge To Transformation
     Divi Code Module — standalone block

     SETUP NOTES:
     1. Place this in a Divi Code Module inside a Section
        with Background Color: #000000.
     2. Set the Divi Section padding to 0 — this block
        manages its own 120px top/bottom padding.
     3. Update the href on .alta-bridge__cta to point to
        your Academy page URL.
     ============================================================ -->

<style>
/* --- Font load (remove if already in theme) ------------------- */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lato:wght@300;400;700&display=swap');

/* --- Reset for this block ------------------------------------- */
.alta-bridge *,
.alta-bridge *::before,
.alta-bridge *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* --- Section shell -------------------------------------------- */
.alta-bridge {
  background: #000000;
  padding: 120px 24px;
  text-align: center;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Inner column (760px max) --------------------------------- */
.alta-bridge__inner {
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
}

/* --- Eyebrow -------------------------------------------------- */
.alta-bridge__eyebrow {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #B8B8B8;
  display: block;
  margin-bottom: 28px;
  line-height: 1;
}

/* --- Title ---------------------------------------------------- */
.alta-bridge__h2 {
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
  font-size: clamp(2.25rem, 4vw, 3rem);
  line-height: 1.1;
  letter-spacing: -0.015em;
  color: #EDEDED;
  margin-bottom: 32px;
  max-width: 600px;
  margin-left: auto;
  margin-right: auto;
  text-wrap: balance;
}

/* --- Two-line copy -------------------------------------------- */
.alta-bridge__copy {
  font-family: 'Poppins', sans-serif;
  font-weight: 300;
  font-size: clamp(1.25rem, 2.2vw, 1.625rem);
  line-height: 1.5;
  margin-bottom: 52px;
}

.alta-bridge__copy span {
  display: block;
}

/* First line — primary #EDEDED */
.alta-bridge__copy span:first-child {
  color: #EDEDED;
}

/* Second line — muted, secondary register */
.alta-bridge__copy span:last-child {
  color: #B8B8B8;
}

/* --- CTA — secondary style (border, no gold fill) ------------ */
.alta-bridge__cta {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 14px 28px;
  background: transparent;
  color: #EDEDED;
  border: 1px solid #2A2A2A;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  line-height: 1;
}

.alta-bridge__arr {
  color: #8A8A8A;
}

/* --- Séparation avec la section précédente (16.10.2026) ---------
   Trait fin #1F1F1F en haut de la section, limité à la colonne de
   760 px et centré. Même trait sur toutes les sections S02 à S10. */
.alta-bridge {
  position: relative;
}
.alta-bridge::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 48px);
  max-width: 760px;
  height: 1px;
  background: #1F1F1F;
}
</style>

<section class="alta-bridge">
  <div class="alta-bridge__inner">

    <span class="alta-bridge__eyebrow">From Knowledge to Transformation</span>

    <h2 class="alta-bridge__h2">Two products. One discipline.</h2>

    <p class="alta-bridge__copy">
      <span>ALTA MALE LAB explores the ideas.</span>
      <span>ALTA Body &amp; Mind Academy applies them.</span>
    </p>

    <a href="#academy" class="alta-bridge__cta">
      Discover the Academy
      <span class="alta-bridge__arr">→</span>
    </a>

  </div>
</section>

</div>
</body></html>
